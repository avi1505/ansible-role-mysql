---
- name: Controleren of een databasewachtwoord is ingesteld
  ansible.builtin.assert:
    that:
      - mysql_password | length > 0
    fail_msg: "Stel mysql_password in voordat je deze role uitvoert."

- name: MySQL en Python packages installeren
  ansible.builtin.apt:
    name: "{{ mysql_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: MySQL starten en automatisch laten opstarten
  ansible.builtin.service:
    name: "{{ mysql_service }}"
    state: started
    enabled: true

- name: MySQL-luisteradres configureren
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^\s*bind-address\s*='
    line: "bind-address = {{ mysql_bind_address }}"
  notify: MySQL herstarten

- name: Database aanmaken
  ansible.mysql.mysql_db:
    name: "{{ mysql_database }}"
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    config_file: ""

- name: Databasegebruiker voor toegestane hosts aanmaken
  ansible.mysql.mysql_user:
    name: "{{ mysql_username }}"
    password: "{{ mysql_password }}"
    host: "{{ item }}"
    priv: "{{ mysql_database }}.*:ALL"
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    config_file: ""
  loop: "{{ mysql_allowed_hosts }}"
  no_log: true